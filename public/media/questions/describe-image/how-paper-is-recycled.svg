<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="How paper is recycled">
<rect width="800" height="500" fill="#ffffff"/>
<text x="400" y="38" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#0f172a" text-anchor="middle">How paper is recycled</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<line x1="254.3" y1="170" x2="299" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="501" y1="170" x2="545.7" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="646.7" y1="215" x2="646.7" y2="325" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="545.7" y1="370" x2="501" y2="370" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="299" y1="370" x2="254.3" y2="370" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="58.3" y="131" width="190" height="78" rx="12" fill="#ffffff" stroke="#2e5bff" stroke-width="2.5"/>
<circle cx="62.3" cy="135" r="14" fill="#2e5bff"/>
<text x="62.3" y="140" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="153.3" y="175" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">Used paper is collected</text>
<rect x="305" y="131" width="190" height="78" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<circle cx="309" cy="135" r="14" fill="#e8590c"/>
<text x="309" y="140" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="400" y="166" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">Paper is sorted by</text>
<text x="400" y="184" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">grade</text>
<rect x="551.7" y="131" width="190" height="78" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
<circle cx="555.7" cy="135" r="14" fill="#0d9488"/>
<text x="555.7" y="140" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="646.7" y="166" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">Paper is mixed with</text>
<text x="646.7" y="184" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">water to make pulp</text>
<rect x="551.7" y="331" width="190" height="78" rx="12" fill="#ffffff" stroke="#c026d3" stroke-width="2.5"/>
<circle cx="555.7" cy="335" r="14" fill="#c026d3"/>
<text x="555.7" y="340" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="646.7" y="366" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">Ink and contaminants</text>
<text x="646.7" y="384" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">are removed</text>
<rect x="305" y="331" width="190" height="78" rx="12" fill="#ffffff" stroke="#ca8a04" stroke-width="2.5"/>
<circle cx="309" cy="335" r="14" fill="#ca8a04"/>
<text x="309" y="340" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="400" y="366" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">Pulp is pressed and</text>
<text x="400" y="384" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">dried</text>
<rect x="58.3" y="331" width="190" height="78" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
<circle cx="62.3" cy="335" r="14" fill="#64748b"/>
<text x="62.3" y="340" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="153.3" y="366" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">New paper is rolled and</text>
<text x="153.3" y="384" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">cut</text>
</svg>